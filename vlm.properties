# Settings for vlm_bridge.py. Lines are "key = value"; "#" starts a comment.
# Command-line flags (--backend, --model, --feedback) override these for one run.

# Which vision model answers: "ollama" (self-hosted on this Mac) or "openrouter" (cloud API).
backend = ollama

# every_step: the model looks again after every action (more frequent visual checks).
# after_plan: follow the plan; ask the model again on failure or when the plan finishes.
feedback = after_plan

# ---- Self-hosted: Ollama -------------------------------------------------------------
# Install Ollama, start it, then pull BOTH models listed below (see README.md).
ollama.url = http://localhost:11434/api/chat
# Choose qwen or llama, then restart tools/run_local.py. Only one runs at a time.
# The launcher selects the compatible installed Ollama version automatically.
# A full Ollama model tag is also accepted; --model overrides this for one run.
ollama.model = qwen
ollama.models.qwen = qwen3-vl:8b-instruct
ollama.models.llama = llama3.2-vision:11b
# Keep local inference bounded; increase timeout for a slow first load.
ollama.timeout = 300
ollama.num_ctx = 8192
ollama.num_batch = 128
# Llama 11B needs smaller working buffers on a 16 GB Mac.
ollama.llama.num_ctx = 4096
ollama.llama.num_batch = 32
ollama.keep_alive = 5m

# ---- Cloud: OpenRouter ---------------------------------------------------------------
# Optional: used ONLY when backend = openrouter (or --backend openrouter).
# Local Ollama failures never send images or commands to OpenRouter automatically.
openrouter.url = https://openrouter.ai/api/v1/chat/completions
# OpenRouter has no free Qwen vision model at the moment. Free models that take images:
#   nvidia/nemotron-3.5-super-vl:free, google/gemma-4-31b-it:free, google/gemma-4-26b-a4b-it:free
# Qwen vision models there are paid (need credits), e.g. qwen/qwen3-vl-8b-instruct, qwen/qwen3.7-flash.
openrouter.model = google/gemma-4-31b-it:free
# Tried in order if the main model is down or busy (comma-separated, optional).
openrouter.fallback_models = google/gemma-4-26b-a4b-it:free, nvidia/nemotron-3.5-super-vl:free
# The API key is never written in this file or in code. It is read from the environment
# variable named here, or else from key_file (the first "sk-or-..." token in that file).
openrouter.key_env = OPENROUTER_API_KEY
openrouter.key_file = creds/openRouter.txt
# Shown on your OpenRouter activity page.
openrouter.app_name = Sports Robot IUI
# How often to retry when OpenRouter says "busy" (HTTP 429/5xx), with growing waits.
openrouter.retries = 3
